<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantoms Enterprises</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #2c3e50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 35px;
    }

    /* Brand Header with Isometric Cube Logo */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eef2f5;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a2b4c;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand-title span {
      color: #e67e22;
      display: inline-block;
    }

    /* Horizontal Form Grid Layout */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Field Inputs */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fcfdfe;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: #2980b9;
      background-color: #ffffff;
    }

    .phone-wrap {
      display: flex;
      gap: 8px;
    }

    .country-select {
      padding: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 600;
      color: #2c3e50;
    }

    /* Buttons & Actions */
    .action-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #2980b9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background-color: #1b6aaa;
    }

    .login-link-box {
      background-color: #f8fafc;
      border: 1px solid #eef2f5;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #7f8c8d;
    }

    .login-link-box a {
      color: #2980b9;
      font-weight: 600;
      text-decoration: none;
    }

    .login-link-box a:hover {
      text-decoration: underline;
    }

    /* Footer */
    .footer-text {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #95a5a6;
    }

    /* Target Removal CSS (Verification Code, Invite Code, Red Dots, Recruitment, Apps, Telegram) */
    .verification-group,
    .invite-code-group,
    .red-dot,
    .company-recruitment,
    .android-app-section,
    .telegram-btn,
    a[href*="t.me"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Brand Header with Logo -->
    <div class="brand-header">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L90 25 L50 45 L10 25 Z" fill="#F39C12"/>
        <path d="M10 25 L50 45 L50 95 L10 75 Z" fill="#E67E22"/>
        <path d="M50 45 L90 25 L90 75 L50 95 Z" fill="#D35400"/>
      </svg>
      <div>
        <h1 class="brand-title">PHANTOMS<br><span>ENTERPRISES</span></h1>
      </div>
    </div>

    <!-- Registration Form Horizontal Grid Layout -->
    <form id="registerForm">
      <div class="form-grid">
        
        <!-- Left Column: Account Credentials -->
        <div class="form-section">
          <span class="section-label">Account Details</span>

          <div class="field-group">
            <label>Phone Number</label>
            <div class="phone-wrap">
              <select class="country-select">
                <option>+254</option>
              </select>
              <input type="tel" class="input-box" placeholder="Enter phone number" required>
            </div>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input type="password" class="input-box" placeholder="Create password" required>
          </div>

          <div class="field-group">
            <label>Confirm Password</label>
            <input type="password" class="input-box" placeholder="Re-enter password" required>
          </div>
        </div>

        <!-- Right Column: Submission & Navigation -->
        <div class="form-section action-panel">
          <div>
            <span class="section-label">Complete Registration</span>
            <p style="font-size: 13px; color: #7f8c8d; margin-top: 8px; margin-bottom: 20px;">
              Please ensure your details are correct before submitting your account creation request.
            </p>
            <button type="submit" class="submit-btn">Register Account</button>
          </div>

          <div class="login-link-box">
            Already registered? <a href="#">Sign in to your account</a>
          </div>
        </div>

      </div>
    </form>

    <div class="footer-text">
      &copy; Phantoms Enterprises. All rights reserved.
    </div>

  </div>

</body>
</html>
