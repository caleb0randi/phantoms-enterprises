<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantoms Enterprises - Registration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 35px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eef2f5;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a2b4c;
      line-height: 1.1;
    }

    .brand-title span {
      color: #e67e22;
      display: inline-block;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fcfdfe;
      outline: none;
    }

    .input-box:focus {
      border-color: #2980b9;
      background-color: #ffffff;
    }

    .phone-wrap, .code-wrap {
      display: flex;
      gap: 8px;
    }

    .country-select {
      padding: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 600;
    }

    .send-code-btn {
      padding: 0 16px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .send-code-btn:hover {
      background-color: #d35400;
    }

    .consent-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #555;
      margin-top: 5px;
    }

    .consent-group input {
      margin-top: 3px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #2980b9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #1b6aaa;
    }

    .status-alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      margin-top: 10px;
    }

    .status-alert.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-alert.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .login-link-box {
      background-color: #f8fafc;
      border: 1px solid #eef2f5;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #7f8c8d;
      margin-top: auto;
    }

    .login-link-box a {
      color: #2980b9;
      font-weight: 600;
      text-decoration: none;
    }

    /* Target removals */
    .company-recruitment, .android-app-section, .telegram-btn, a[href*="t.me"] {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5 L90 25 L50 45 L10 25 Z" fill="#F39C12"/>
        <path d="M10 25 L50 45 L50 95 L10 75 Z" fill="#E67E22"/>
        <path d="M50 45 L90 25 L90 75 L50 95 Z" fill="#D35400"/>
      </svg>
      <div>
        <h1 class="brand-title">PHANTOMS<br><span>ENTERPRISES</span></h1>
      </div>
    </div>

    <form id="registerForm">
      <div class="form-grid">
        
        <!-- Left Column: User Input Credentials -->
        <div class="form-section">
          <span class="section-label">Account Registration</span>

          <div class="field-group">
            <label>Phone Number</label>
            <div class="phone-wrap">
              <select class="country-select">
                <option>+254</option>
              </select>
              <input type="tel" id="phone" class="input-box" placeholder="Enter phone number" required>
            </div>
          </div>

          <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="email" class="input-box" placeholder="Enter your email" required>
          </div>

          <div class="field-group">
            <label>Email Verification Code</label>
            <div class="code-wrap">
              <input type="text" id="verificationCode" class="input-box" placeholder="Enter 6-digit code" required>
              <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="generateEmailCode()">Send Code</button>
            </div>
          </div>

          <div class="field-group">
            <label>Password</label>
            <input type="password" id="password" class="input-box" placeholder="Create password" required>
          </div>

          <div class="field-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" class="input-box" placeholder="Re-enter password" required>
          </div>
        </div>

        <!-- Right Column: Verification, Consent & Action -->
        <div class="form-section">
          <span class="section-label">Terms & Submission</span>

          <div class="consent-group">
            <input type="checkbox" id="consentCheck" required>
            <label for="consentCheck">
              I agree to the Terms of Service and Privacy Policy, and consent to receive email verification codes.
            </label>
          </div>

          <button type="submit" class="submit-btn">Register Account</button>
          
          <div id="statusAlert" class="status-alert"></div>

          <div class="login-link-box">
            Already registered? <a href="#">Sign in to your account</a>
          </div>
        </div>

      </div>
    </form>
  </div>

  <script>
    let activeCode = "";

    function generateEmailCode() {
      const email = document.getElementById('email').value;
      const statusAlert = document.getElementById('statusAlert');
      
      if (!email) {
        statusAlert.className = "status-alert error";
        statusAlert.innerText = "Please enter an email address first.";
        statusAlert.style.display = "block";
        return;
      }

      // Generate random 6-digit verification code
      activeCode = Math.floor(100000 + Math.random() * 900000).toString();
      
      // Displays verification code on screen for user testing
      statusAlert.className = "status-alert success";
      statusAlert.innerText = `Verification code sent to ${email}. (Demo Code: ${activeCode})`;
      statusAlert.style.display = "block";
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const code = document.getElementById('verificationCode').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const statusAlert = document.getElementById('statusAlert');

      if (password !== confirmPassword) {
        statusAlert.className = "status-alert error";
        statusAlert.innerText = "Passwords do not match.";
        statusAlert.style.display = "block";
        return;
      }

      if (code !== activeCode) {
        statusAlert.className = "status-alert error";
        statusAlert.innerText = "Invalid verification code. Click 'Send Code' to get a valid code.";
        statusAlert.style.display = "block";
        return;
      }

      // Save user to browser local storage so account persists locally
      const userData = { phone, email, password };
      localStorage.setItem('registeredUser', JSON.stringify(userData));

      statusAlert.className = "status-alert success";
      statusAlert.innerText = "Account successfully registered! You can now log in.";
      statusAlert.style.display = "block";
      
      this.reset();
      activeCode = "";
    });
  </script>
</body>
</html>
