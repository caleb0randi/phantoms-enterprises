<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantoms Enterprises</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 35px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eef2f5;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a2b4c;
      line-height: 1.1;
    }

    .brand-title span {
      color: #e67e22;
    }

    /* Tabs for Auth */
    .tab-switcher {
      display: flex;
      background-color: #eef2f5;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #7f8c8d;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #1a2b4c;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Form Layout */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fcfdfe;
      outline: none;
    }

    .phone-wrap, .code-wrap {
      display: flex;
      gap: 8px;
    }

    .country-select {
      padding: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 600;
    }

    .send-code-btn {
      padding: 0 16px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #2980b9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .status-alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      margin-bottom: 20px;
    }

    .status-alert.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-alert.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* DASHBOARD STYLES */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 20px;
      border-radius: 10px;
    }

    .stat-title { font-size: 12px; color: #64748b; font-weight: 700; text-transform: uppercase; }
    .stat-value { font-size: 24px; font-weight: 800; color: #0f172a; margin-top: 5px; }

    .action-row {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .btn-deposit { background-color: #27ae60; color: white; }
    .btn-withdraw { background-color: #e74c3c; color: white; }

    .dash-section {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .dash-section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #1e293b;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .plan-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .plan-card h4 { color: #e67e22; margin-bottom: 8px; }
    .plan-card p { font-size: 13px; color: #64748b; margin-bottom: 12px; }

    .logout-btn {
      background: #94a3b8;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Header -->
    <div class="brand-header">
      <div class="brand-logo-wrap">
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
          <path d="M50 5 L90 25 L50 45 L10 25 Z" fill="#F39C12"/>
          <path d="M10 25 L50 45 L50 95 L10 75 Z" fill="#E67E22"/>
          <path d="M50 45 L90 25 L90 75 L50 95 Z" fill="#D35400"/>
        </svg>
        <h1 class="brand-title">PHANTOMS<br><span>ENTERPRISES</span></h1>
      </div>
      <button id="logoutBtn" class="logout-btn hidden" onclick="logout()">Sign Out</button>
    </div>

    <!-- Alert Banner -->
    <div id="statusAlert" class="status-alert"></div>

    <!-- AUTHENTICATION VIEW -->
    <div id="authView">
      <div class="tab-switcher">
        <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">Register</button>
        <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      </div>

      <!-- Register Form -->
      <form id="registerForm">
        <div class="form-grid">
          <div class="form-section">
            <span class="section-label">Account Creation</span>
            <div class="field-group">
              <label>Phone Number</label>
              <div class="phone-wrap">
                <select class="country-select"><option>+254</option></select>
                <input type="tel" id="regPhone" class="input-box" placeholder="Enter phone number" required>
              </div>
            </div>
            <div class="field-group">
              <label>Email Address</label>
              <input type="email" id="regEmail" class="input-box" placeholder="Enter your email" required>
            </div>
            <div class="field-group">
              <label>Verification Code</label>
              <div class="code-wrap">
                <input type="text" id="regCode" class="input-box" placeholder="Enter code from email" required>
                <button type="button" class="send-code-btn" onclick="sendBrevoEmailCode()">Send Code</button>
              </div>
            </div>
          </div>

          <div class="form-section">
            <span class="section-label">Security</span>
            <div class="field-group">
              <label>Password</label>
              <input type="password" id="regPassword" class="input-box" placeholder="Create password" required>
            </div>
            <div class="field-group">
              <label>Confirm Password</label>
              <input type="password" id="regConfirmPassword" class="input-box" placeholder="Re-enter password" required>
            </div>
            <button type="submit" class="submit-btn" style="margin-top: auto;">Register & Enter</button>
          </div>
        </div>
      </form>

      <!-- Login Form -->
      <form id="loginForm" class="hidden">
        <div class="form-section" style="max-width: 400px; margin: 0 auto;">
          <span class="section-label">Sign In to Dashboard</span>
          <div class="field-group">
            <label>Email or Phone</label>
            <input type="text" id="loginIdentifier" class="input-box" placeholder="Enter email or phone" required>
          </div>
          <div class="field-group">
            <label>Password</label>
            <input type="password" id="loginPassword" class="input-box" placeholder="Enter password" required>
          </div>
          <button type="submit" class="submit-btn" style="margin-top: 10px;">Sign In</button>
        </div>
      </form>
    </div>

    <!-- USER DASHBOARD INTERFACE VIEW -->
    <div id="dashboardView" class="hidden">
      
      <!-- Balance & Stats Grid -->
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-title">Total Balance</div>
          <div class="stat-value" id="userBalance">KES 0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Active Investments</div>
          <div class="stat-value" id="userInvestments">KES 0.00</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">Total Referrals</div>
          <div class="stat-value" id="userReferrals">0 Users</div>
        </div>
      </div>

      <!-- Financial Action Buttons -->
      <div class="action-row">
        <button class="btn-action btn-deposit" onclick="alert('Deposit portal opening...')">Deposit Funds</button>
        <button class="btn-action btn-withdraw" onclick="alert('Withdrawal portal opening...')">Withdraw Funds</button>
      </div>

      <!-- Investment Plans -->
      <div class="dash-section">
        <div class="dash-section-title">Available Investment Plans</div>
        <div class="plans-grid">
          <div class="plan-card">
            <h4>Starter Plan</h4>
            <p>10% Daily Returns / 5 Days</p>
            <button class="send-code-btn" style="width: 100%;" onclick="alert('Starter Plan selected')">Invest Now</button>
          </div>
          <div class="plan-card">
            <h4>Pro Plan</h4>
            <p>25% Daily Returns / 10 Days</p>
            <button class="send-code-btn" style="width: 100%;" onclick="alert('Pro Plan selected')">Invest Now</button>
          </div>
        </div>
      </div>

      <!-- Referral Program -->
      <div class="dash-section">
        <div class="dash-section-title">Your Referral Link</div>
        <div class="field-group">
          <input type="text" id="refLink" class="input-box" readonly value="https://phantoms.enterprises/register?ref=USER123">
        </div>
      </div>

    </div>

  </div>

  <script>
    // ==========================================
    // BREVO API CONFIGURATION
    // Update BREVO_API_KEY and SENDER_EMAIL below
    // ==========================================
    const BREVO_API_KEY = "xkeysib-YOUR_ACTUAL_API_KEY_HERE";
    const SENDER_EMAIL = "your-verified-sender@example.com";
    const SENDER_NAME = "Phantoms Enterprises";

    let activeVerificationCode = "";

    function showAlert(msg, isError = false) {
      const alertBox = document.getElementById('statusAlert');
      alertBox.className = isError ? "status-alert error" : "status-alert success";
      alertBox.innerText = msg;
      alertBox.style.display = "block";
    }

    function switchTab(mode) {
      document.getElementById('statusAlert').style.display = "none";
      if (mode === 'register') {
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
      } else {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
      }
    }

    // Direct Brevo Transmission Logic
    async function sendBrevoEmailCode() {
      const email = document.getElementById('regEmail').value;
      if (!email) {
        showAlert("Please enter an email address first.", true);
        return;
      }

      activeVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();
      showAlert("Sending verification code to your email...");

      const payload = {
        sender: { name: SENDER_NAME, email: SENDER_EMAIL },
        to: [{ email: email }],
        subject: "Phantoms Enterprises - Verification Code",
        htmlContent: `
          <div style="font-family: Arial, sans-serif; padding: 20px; color: #333;">
            <h2>Phantoms Enterprises Verification</h2>
            <p>Your 6-digit account verification code is:</p>
            <h1 style="color: #e67e22; letter-spacing: 2px;">${activeVerificationCode}</h1>
            <p>If you did not request this code, please ignore this email.</p>
          </div>
        `
      };

      try {
        const response = await fetch("https://api.brevo.com/v3/smtp/email", {
          method: "POST",
          headers: {
            "accept": "application/json",
            "api-key": BREVO_API_KEY,
            "content-type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.messageId) {
          showAlert(`Verification code sent to ${email}. Please check your email inbox.`);
        } else {
          console.error("Brevo API Response:", data);
          showAlert(`Brevo Error: ${data.message || 'Check API key or verified sender.'}`, true);
        }
      } catch (err) {
        console.error("Network or CORS error connecting to Brevo:", err);
        showAlert("Connection failed. Check browser console (F12) for network logs.", true);
      }
    }

    // Launch User Dashboard UI
    function launchDashboard(user) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('statusAlert').style.display = "none";
      
      document.getElementById('refLink').value = `https://phantoms.enterprises/register?ref=${user.phone || 'USER'}`;
    }

    function logout() {
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      switchTab('login');
      showAlert("Signed out successfully.");
    }

    // Registration Form Logic
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const code = document.getElementById('regCode').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        showAlert("Passwords do not match.", true);
        return;
      }

      if (activeVerificationCode && code !== activeVerificationCode) {
        showAlert("Invalid verification code. Please enter the code received in your email.", true);
        return;
      }

      const user = { phone, email, password };
      const users = JSON.parse(localStorage.getItem('phantoms_users') || '[]');
      users.push(user);
      localStorage.setItem('phantoms_users', JSON.stringify(users));

      // Direct redirect into dashboard
      launchDashboard(user);
    });

    // Login Form Logic
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;

      const users = JSON.parse(localStorage.getItem('phantoms_users') || '[]');
      const validUser = users.find(u => (u.email === identifier || u.phone === identifier) && u.password === password);

      if (validUser) {
        launchDashboard(validUser);
      } else {
        showAlert("Invalid credentials. Please check your details.", true);
      }
    });
  </script>
</body>
</html>
