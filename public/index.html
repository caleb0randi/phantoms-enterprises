<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantoms Enterprises</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 35px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eef2f5;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a2b4c;
      line-height: 1.1;
    }

    .brand-title span {
      color: #e67e22;
      display: inline-block;
    }

    /* Form Layout Switcher (Register / Sign In) */
    .tab-switcher {
      display: flex;
      background-color: #eef2f5;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #7f8c8d;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #1a2b4c;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Grid Layout */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fcfdfe;
      outline: none;
    }

    .input-box:focus {
      border-color: #2980b9;
      background-color: #ffffff;
    }

    .phone-wrap, .code-wrap {
      display: flex;
      gap: 8px;
    }

    .country-select {
      padding: 12px;
      border: 1px solid #dcdfe6;
      border-radius: 8px;
      background: #f8fafc;
      font-weight: 600;
    }

    .send-code-btn {
      padding: 0 16px;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .send-code-btn:hover {
      background-color: #d35400;
    }

    .consent-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #555;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #2980b9;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .submit-btn:hover {
      background-color: #1b6aaa;
    }

    .status-alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .status-alert.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-alert.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .form-toggle-view {
      display: block;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <svg class="logo-icon" viewBox="0 0 100 100" fill="none">
        <path d="M50 5 L90 25 L50 45 L10 25 Z" fill="#F39C12"/>
        <path d="M10 25 L50 45 L50 95 L10 75 Z" fill="#E67E22"/>
        <path d="M50 45 L90 25 L90 75 L50 95 Z" fill="#D35400"/>
      </svg>
      <div>
        <h1 class="brand-title">PHANTOMS<br><span>ENTERPRISES</span></h1>
      </div>
    </div>

    <!-- Mode Switcher -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">Register</button>
      <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    </div>

    <!-- Alert Box -->
    <div id="statusAlert" class="status-alert" style="margin-bottom: 20px;"></div>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="form-toggle-view">
      <div class="form-grid">
        <div class="form-section">
          <span class="section-label">Account Creation</span>

          <div class="field-group">
            <label>Phone Number</label>
            <div class="phone-wrap">
              <select class="country-select">
                <option>+254</option>
              </select>
              <input type="tel" id="regPhone" class="input-box" placeholder="Enter phone number" required>
            </div>
          </div>

          <div class="field-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" class="input-box" placeholder="Enter your email" required>
          </div>

          <div class="field-group">
            <label>Verification Code</label>
            <div class="code-wrap">
              <input type="text" id="regCode" class="input-box" placeholder="Enter 6-digit code" required>
              <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="sendBrevoEmailCode()">Send Code</button>
            </div>
          </div>
        </div>

        <div class="form-section">
          <span class="section-label">Password & Consent</span>

          <div class="field-group">
            <label>Password</label>
            <input type="password" id="regPassword" class="input-box" placeholder="Create password" required>
          </div>

          <div class="field-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirmPassword" class="input-box" placeholder="Re-enter password" required>
          </div>

          <div class="consent-group">
            <input type="checkbox" id="regConsent" required>
            <label for="regConsent">I agree to the Terms of Service & Privacy Policy.</label>
          </div>

          <button type="submit" class="submit-btn">Create Account</button>
        </div>
      </div>
    </form>

    <!-- SIGN IN FORM -->
    <form id="loginForm" class="form-toggle-view hidden">
      <div class="form-section" style="max-width: 400px; margin: 0 auto;">
        <span class="section-label">Sign In to Your Account</span>

        <div class="field-group">
          <label>Email Address or Phone</label>
          <input type="text" id="loginIdentifier" class="input-box" placeholder="Enter email or phone" required>
        </div>

        <div class="field-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="input-box" placeholder="Enter password" required>
        </div>

        <button type="submit" class="submit-btn" style="margin-top: 10px;">Sign In</button>
      </div>
    </form>

  </div>

  <script>
    // ==========================================
    // BREVO API CONFIGURATION
    // Replace with your actual Brevo API Key & Sender Email
    // ==========================================
    const BREVO_API_KEY = "YOUR_BREVO_API_KEY_HERE"; 
    const SENDER_EMAIL = "your-verified-sender@example.com"; 
    const SENDER_NAME = "Phantoms Enterprises";

    let generatedCode = "";

    function showAlert(message, isError = false) {
      const alertBox = document.getElementById('statusAlert');
      alertBox.className = isError ? "status-alert error" : "status-alert success";
      alertBox.innerText = message;
      alertBox.style.display = "block";
    }

    function switchTab(mode) {
      document.getElementById('statusAlert').style.display = "none";
      if (mode === 'register') {
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
      } else {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
      }
    }

    // Send Verification Code via Brevo API
    async function sendBrevoEmailCode() {
      const email = document.getElementById('regEmail').value;
      if (!email) {
        showAlert("Please enter an email address first.", true);
        return;
      }

      generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

      showAlert("Sending email verification code...");

      try {
        const response = await fetch("https://api.brevo.com/v3/smtp/email", {
          method: "POST",
          headers: {
            "accept": "application/json",
            "api-key": BREVO_API_KEY,
            "content-type": "application/json"
          },
          body: JSON.stringify({
            sender: { name: SENDER_NAME, email: SENDER_EMAIL },
            to: [{ email: email }],
            subject: "Your Phantoms Enterprises Verification Code",
            htmlContent: `<p>Your verification code is: <strong>${generatedCode}</strong></p>`
          })
        });

        if (response.ok) {
          showAlert(`Verification code sent to ${email}. Check your inbox!`);
        } else {
          // If API Key is not set or fails, fallback to screen notification
          console.error("Brevo API error:", await response.text());
          showAlert(`Code dispatch ready. (Code: ${generatedCode})`);
        }
      } catch (err) {
        console.error(err);
        showAlert(`Code dispatch ready. (Code: ${generatedCode})`);
      }
    }

    // Account Registration Handler
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      const code = document.getElementById('regCode').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        showAlert("Passwords do not match.", true);
        return;
      }

      if (generatedCode && code !== generatedCode) {
        showAlert("Invalid verification code. Please check your email or request a new code.", true);
        return;
      }

      // Store account in browser database so user can log in
      const users = JSON.parse(localStorage.getItem('phantoms_users') || '[]');
      
      const existing = users.find(u => u.email === email || u.phone === phone);
      if (existing) {
        showAlert("An account with this email or phone number already exists.", true);
        return;
      }

      users.push({ phone, email, password });
      localStorage.setItem('phantoms_users', JSON.stringify(users));

      showAlert("Account successfully registered! Switch to Sign In to log in.");
      this.reset();
      generatedCode = "";
    });

    // Account Login Handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;

      const users = JSON.parse(localStorage.getItem('phantoms_users') || '[]');
      const validUser = users.find(u => (u.email === identifier || u.phone === identifier) && u.password === password);

      if (validUser) {
        showAlert(`Welcome back! Logged in as ${validUser.email}`);
      } else {
        showAlert("Invalid credentials. Please check your email/phone and password.", true);
      }
    });
  </script>
</body>
</html>
