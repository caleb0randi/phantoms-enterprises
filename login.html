<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantoms Enterprises - Authentication</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { margin-top: 0; text-align: center; color: #333; }
        .input-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; color: #666; font-size: 0.9rem; }
        input { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #0056b3; }
        .toggle-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
        .toggle-link a { color: #007bff; text-decoration: none; cursor: pointer; }
        .code-row { display: flex; gap: 0.5rem; }
        .code-row button { width: auto; white-space: nowrap; font-size: 0.8rem; margin: 0; }
        .alert { padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; display: none; font-size: 0.85rem; text-align: center; }
        .alert-error { background: #ffe6e6; color: #d9534f; }
        .alert-success { background: #e6ffe6; color: #5cb85c; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="form-title">Login</h2>
    <div id="msg" class="alert"></div>

    <!-- LOGIN FORM -->
    <form id="login-form">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="login-username" autocomplete="username" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" autocomplete="current-password" required>
        </div>
        <button type="submit">Log In</button>
        <div class="toggle-link">
            Don't have an account? <a onclick="showSignup()">Create an Account</a>
        </div>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signup-form" style="display: none;">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="signup-username" required>
        </div>
        <div class="input-group">
            <label>Email or Phone Number</label>
            <div class="code-row">
                <input type="email" id="signup-contact" required placeholder="user@example.com">
                <button type="button" onclick="sendCode()">Get Code</button>
            </div>
        </div>
        <div class="input-group">
            <label>Verification Code</label>
            <input type="text" id="signup-code" required placeholder="6-digit code">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="signup-password" required>
        </div>
        <button type="submit">Sign Up</button>
        <div class="toggle-link">
            Already have an account? <a onclick="showLogin()">Log In</a>
        </div>
    </form>
</div>

<script>
    const msg = document.getElementById('msg');

    function showMsg(text, isError = true) {
        msg.textContent = text;
        msg.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
        msg.style.display = 'block';
    }

    function showSignup() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('signup-form').style.display = 'block';
        document.getElementById('form-title').textContent = 'Create Account';
        msg.style.display = 'none';
    }

    function showLogin() {
        document.getElementById('signup-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('form-title').textContent = 'Login';
        msg.style.display = 'none';
    }

    async function sendCode() {
        const contact = document.getElementById('signup-contact').value;
        if (!contact) return showMsg('Please enter an email address.');

        try {
            const res = await fetch('/api/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contact })
            });
            const data = await res.json();
            
            if (data.success) {
                showMsg('Verification code sent to your email!', false);
            } else {
                showMsg(data.message);
            }
        } catch (err) {
            showMsg('Error sending verification code. Please try again.');
        }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('phantom_user', JSON.stringify(data.user));
                window.location.href = '/dashboard';
            } else {
                showMsg(data.message || 'Invalid username or password.');
            }
        } catch (err) {
            showMsg('Login request failed. Server error.');
        }
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('signup-username').value;
        const contact = document.getElementById('signup-contact').value;
        const code = document.getElementById('signup-code').value;
        const password = document.getElementById('signup-password').value;

        try {
            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, contact, password, code })
            });
            const data = await res.json();

            if (data.success) {
                showMsg('Account created! Please log in.', false);
                setTimeout(showLogin, 1500);
            } else {
                showMsg(data.message);
            }
        } catch (err) {
            showMsg('Signup request failed.');
        }
    });
</script>
</body>
</html>
