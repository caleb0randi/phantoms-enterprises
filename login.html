<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phantoms Enterprises | Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .gold-btn { background: linear-gradient(180deg, #f3d09a 0%, #d4a359 100%); color: #1c1305; }
    .gold-btn-outline { border: 1px solid #d4a359; color: #f3d09a; }
    .input-box { background: #1c1c1e; border: 1px solid #2c2c2e; color: #ffffff; }
    .captcha-box { background: #e3b3cf; color: #4a1534; font-family: monospace; letter-spacing: 6px; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 max-w-md mx-auto relative">

  <!-- Floating Telegram Support Icon -->
  <a href="https://t.me" target="_blank" class="fixed right-4 bottom-24 bg-sky-500 p-3 rounded-full shadow-lg z-50 hover:scale-110 transition">
    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.56 8.16l-1.97 9.28c-.15.68-.55.84-1.12.52l-3.05-2.25-1.47 1.42c-.16.16-.3.3-.62.3l.22-3.09 5.63-5.09c.24-.22-.05-.34-.38-.13l-6.96 4.38-2.99-.94c-.65-.2-.66-.65.14-.97l11.7-4.51c.54-.2 1.02.13.87.88z"/></svg>
  </a>

  <!-- Header Branding matched to image -->
  <div class="pt-6 pb-4 text-center">
    <div class="flex items-center justify-center gap-2">
      <div class="w-8 h-8 bg-red-600 rounded-sm"></div>
      <h1 class="text-3xl font-black tracking-wider text-white">PHANTOMS</h1>
    </div>
    <p class="text-amber-400/80 text-xs font-semibold tracking-widest uppercase mt-1">ENTERPRISES</p>
  </div>

  <!-- Form Switcher Tabs -->
  <div class="flex bg-slate-900/90 p-1 rounded-xl mb-4 border border-slate-800 text-xs">
    <button id="tabReg" onclick="switchForm('register')" class="flex-1 py-2 font-bold rounded-lg gold-btn">Register</button>
    <button id="tabLog" onclick="switchForm('login')" class="flex-1 py-2 font-bold text-slate-400">Sign In</button>
  </div>

  <!-- Registration Form matching Prototype Image -->
  <form id="regForm" onsubmit="handleRegistration(event)" class="space-y-3">
    <!-- Phone Field with +254 prefix -->
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">📱</span>
      <span class="text-slate-300 text-xs font-bold mr-2">+254</span>
      <input type="tel" id="regPhone" required placeholder="Enter phone number" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>

    <!-- Password -->
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">🔒</span>
      <input type="password" id="regPassword" required placeholder="Please input a password" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>

    <!-- Confirm Password -->
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">🔒</span>
      <input type="password" id="regConfirmPassword" required placeholder="Please enter your login password again" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>

    <!-- Invite Code -->
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">✉️️</span>
      <input type="text" id="regInviteCode" placeholder="Invite code (optional)" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>

    <!-- Visual Captcha Field -->
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center input-box rounded-full px-4 py-3 flex-1">
        <span class="mr-2 text-slate-400 text-sm">🛡️</span>
        <input type="text" id="regCaptcha" required placeholder="Please enter the verification code" class="bg-transparent border-none outline-none w-full text-xs text-white">
      </div>
      <div id="captchaDisplay" onclick="generateCaptcha()" class="captcha-box px-4 py-2.5 rounded-full font-bold text-base cursor-pointer select-none">
        7006
      </div>
    </div>

    <!-- Submit Register -->
    <button type="submit" class="w-full gold-btn font-bold py-3.5 rounded-full text-sm shadow-md hover:brightness-105 transition mt-2">
      Register
    </button>
  </form>

  <!-- Login Form -->
  <form id="logForm" onsubmit="handleLogin(event)" class="space-y-3 hidden">
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">📱</span>
      <input type="text" id="logUsername" required placeholder="Phone number or email" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>
    <div class="flex items-center input-box rounded-full px-4 py-3">
      <span class="mr-2 text-slate-400 text-sm">🔒</span>
      <input type="password" id="logPassword" required placeholder="Password" class="bg-transparent border-none outline-none w-full text-xs text-white">
    </div>
    <button type="submit" class="w-full gold-btn font-bold py-3.5 rounded-full text-sm shadow-md hover:brightness-105 transition mt-2">
      Sign In
    </button>
  </form>

  <!-- Toggle Link Button matching Prototype -->
  <div class="mt-3">
    <button id="toggleBtn" onclick="switchForm('login')" class="w-full gold-btn-outline font-semibold py-3 rounded-full text-xs bg-slate-950/60">
      Already have an account, log in now
    </button>
  </div>

  <!-- Resource Action Buttons matching Prototype -->
  <div class="space-y-2 mt-4">
    <button onclick="alert('Company Recruitment details: Contact admin via Telegram support.')" class="w-full py-3 rounded-full bg-amber-200/90 text-slate-950 text-xs font-bold shadow">
      Company Recruitment
    </button>
    <button onclick="alert('Android application coming soon to Google Play Store.')" class="w-full py-3 rounded-full bg-emerald-400/90 text-slate-950 text-xs font-bold shadow">
      Android applications
    </button>
  </div>

  <div id="statusMsg" class="mt-3 text-center text-xs font-bold text-amber-400 hidden"></div>

  <script>
    let generatedCode = "7006";

    document.addEventListener('DOMContentLoaded', () => {
      // Direct access check: If already logged in, redirect straight to dashboard
      if (localStorage.getItem('userEmail') || localStorage.getItem('userRole')) {
        window.location.href = '/dashboard';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref') || urlParams.get('inviteCode');
      if (ref) {
        document.getElementById('regInviteCode').value = ref;
      }
      generateCaptcha();
    });

    function generateCaptcha() {
      generatedCode = Math.floor(1000 + Math.random() * 9000).toString();
      document.getElementById('captchaDisplay').innerText = generatedCode;
    }

    function switchForm(mode) {
      const regForm = document.getElementById('regForm');
      const logForm = document.getElementById('logForm');
      const tabReg = document.getElementById('tabReg');
      const tabLog = document.getElementById('tabLog');
      const toggleBtn = document.getElementById('toggleBtn');

      if (mode === 'register') {
        regForm.classList.remove('hidden');
        logForm.classList.add('hidden');
        tabReg.className = "flex-1 py-2 font-bold rounded-lg gold-btn";
        tabLog.className = "flex-1 py-2 font-bold text-slate-400";
        toggleBtn.innerText = "Already have an account, log in now";
        toggleBtn.onclick = () => switchForm('login');
      } else {
        regForm.classList.add('hidden');
        logForm.classList.remove('hidden');
        tabLog.className = "flex-1 py-2 font-bold rounded-lg gold-btn";
        tabReg.className = "flex-1 py-2 font-bold text-slate-400";
        toggleBtn.innerText = "Need an account? Register now";
        toggleBtn.onclick = () => switchForm('register');
      }
    }

    async function handleRegistration(e) {
      e.preventDefault();
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const inviteCode = document.getElementById('regInviteCode').value;
      const captcha = document.getElementById('regCaptcha').value;
      const status = document.getElementById('statusMsg');

      if (captcha !== generatedCode) {
        status.innerText = "Verification captcha incorrect. Click code to refresh.";
        status.classList.remove('hidden');
        return;
      }

      const res = await fetch('/api/register/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password, confirmPassword, inviteCode, captcha })
      });

      const data = await res.json();
      if (data.success) {
        status.className = "mt-3 text-center text-xs font-bold text-emerald-400";
        status.innerText = "Registration successful! Please sign in.";
        status.classList.remove('hidden');
        setTimeout(() => switchForm('login'), 1000);
      } else {
        status.className = "mt-3 text-center text-xs font-bold text-red-400";
        status.innerText = data.message;
        status.classList.remove('hidden');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('logUsername').value;
      const password = document.getElementById('logPassword').value;
      const status = document.getElementById('statusMsg');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      if (data.success) {
        localStorage.setItem('userRole', data.user.role);
        localStorage.setItem('userEmail', data.user.email);
        localStorage.setItem('username', data.user.username);
        if (data.user.referralCode) localStorage.setItem('referralCode', data.user.referralCode);

        status.className = "mt-3 text-center text-xs font-bold text-emerald-400";
        status.innerText = "Login successful! Loading dashboard...";
        status.classList.remove('hidden');
        setTimeout(() => window.location.href = '/dashboard', 600);
      } else {
        status.className = "mt-3 text-center text-xs font-bold text-red-400";
        status.innerText = data.message;
        status.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
