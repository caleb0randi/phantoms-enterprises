<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Phantoms Enterprises</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl glass">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-white tracking-wider">PHANTOMS</h1>
      <p class="text-amber-400 text-xs font-semibold uppercase tracking-widest mt-1">Enterprises Access Portal</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="phantomsenterprises@gmail.com"
          class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500 transition"
        >
      </div>

      <button 
        type="submit" 
        class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition shadow-lg"
      >
        Sign In
      </button>
    </form>

    <div id="statusMessage" class="mt-4 text-center text-sm font-semibold hidden"></div>

  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById('email').value;
      const statusMsg = document.getElementById('statusMessage');

      statusMsg.className = "mt-4 text-center text-sm font-semibold text-blue-400";
      statusMsg.innerText = "Authenticating...";
      statusMsg.classList.remove('hidden');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput })
        });

        const data = await response.json();

        if (data.success) {
          // Save role and email sent back from server whitelist
          localStorage.setItem('userRole', data.user.role);
          localStorage.setItem('userEmail', data.user.email);

          statusMsg.className = "mt-4 text-center text-sm font-semibold text-emerald-400";
          statusMsg.innerText = `Login successful! Redirecting as ${data.user.role}...`;

          // Redirect to main platform dashboard
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1000);
        } else {
          statusMsg.className = "mt-4 text-center text-sm font-semibold text-red-400";
          statusMsg.innerText = data.message || "Login failed.";
        }
      } catch (err) {
        console.error("Login error:", err);
        statusMsg.className = "mt-4 text-center text-sm font-semibold text-red-400";
        statusMsg.innerText = "Server error. Please try again.";
      }
    }
  </script>

</body>
</html>
