<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Portal | Phantoms Enterprises</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
    .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl glass">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-white tracking-wider">PHANTOMS</h1>
      <p class="text-amber-400 text-xs font-semibold uppercase tracking-widest mt-1">Enterprises Access Portal</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="flex mb-6 bg-slate-950 p-1 rounded-xl border border-slate-800">
      <button id="loginTabBtn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-amber-500 text-slate-950">Sign In</button>
      <button id="registerTabBtn" onclick="switchTab('register')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Username / Email</label>
        <input type="text" id="loginUsername" required placeholder="phantomenterprises@gmail.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-amber-500">
      </div>
      <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition shadow-lg">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
        <div class="flex gap-2">
          <input type="email" id="regEmail" required placeholder="user@gmail.com" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-amber-500">
          <button type="button" onclick="sendCode()" class="px-3 py-2 bg-slate-800 text-amber-400 text-xs font-bold rounded-xl hover:bg-slate-700 whitespace-nowrap">Send Code</button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Verification Code</label>
        <input type="text" id="regCode" required placeholder="6-digit code" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Create Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-amber-500">
      </div>
      <button type="submit" class="w-full gold-gradient text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition shadow-lg">Verify & Create Account</button>
    </form>

    <div id="statusMessage" class="mt-4 text-center text-sm font-semibold hidden"></div>

  </div>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginBtn = document.getElementById('loginTabBtn');
      const regBtn = document.getElementById('registerTabBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-amber-500 text-slate-950";
        regBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        regBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-amber-500 text-slate-950";
        loginBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const status = document.getElementById('statusMessage');

      status.className = "mt-4 text-center text-sm font-semibold text-blue-400";
      status.innerText = "Authenticating...";
      status.classList.remove('hidden');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('userRole', data.user.role);
        localStorage.setItem('userEmail', data.user.email);
        status.className = "mt-4 text-center text-sm font-semibold text-emerald-400";
        status.innerText = `Login successful! Redirecting...`;
        setTimeout(() => window.location.href = '/', 800);
      } else {
        status.className = "mt-4 text-center text-sm font-semibold text-red-400";
        status.innerText = data.message || "Invalid credentials.";
      }
    }

    async function sendCode() {
      const email = document.getElementById('regEmail').value;
      const status = document.getElementById('statusMessage');
      if (!email) return alert('Enter email first');

      status.className = "mt-4 text-center text-sm font-semibold text-blue-400";
      status.innerText = "Sending code via Brevo...";
      status.classList.remove('hidden');

      const res = await fetch('/api/register/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      status.className = "mt-4 text-center text-sm font-semibold text-emerald-400";
      status.innerText = data.message;
    }

    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const code = document.getElementById('regCode').value;
      const password = document.getElementById('regPassword').value;
      const status = document.getElementById('statusMessage');

      const res = await fetch('/api/register/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, password })
      });
      const data = await res.json();

      if (data.success) {
        status.className = "mt-4 text-center text-sm font-semibold text-emerald-400";
        status.innerText = "Registration complete! You can now sign in.";
        setTimeout(() => switchTab('login'), 1200);
      } else {
        status.className = "mt-4 text-center text-sm font-semibold text-red-400";
        status.innerText = data.message;
      }
    }
  </script>

</body>
</html>
